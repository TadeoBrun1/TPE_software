openapi: 3.0.3
info:
  title: API de itinerarios de Trotamundos
  version: 0.2.0
  description: >
    Contrato propuesto de la iteración 3 (consulta y gestión de viajes), ampliado en la iteración 4 (autenticación,
    compartición, tarjeta para redes sociales, detalles por tipo de reserva y datos neutros para la
    internacionalización). Lo produce el núcleo y lo consumen la
    aplicación web y la app móvil a través de la puerta de entrada regional (ADR-0004).
    ADRs relacionadas: ADR-0040 (modelo de lectura del panel), ADR-0041 (caché local), ADR-0046 (notificador),
    ADR-0047 (límites y prioridades), ADR-0044 (novedades y cambios manuales), ADR-0048 (asignación a viajes),
    ADR-0045 (archivado y reactivación), ADR-0060 (identidad y tokens), ADR-0061 (compartición y auditoría),
    ADR-0062 (lectura entre regiones), ADR-0063 (tarjeta para redes), ADR-0065 (datos neutros), ADR-0066 (detalles
    por tipo). Respuestas ante carga: 429 = el cliente superó su límite; 503 con Retry-After = sobrecarga, operación
    de prioridad media o baja rechazada. Fechas y horas en ISO 8601 con zona horaria; monedas en ISO 4217; estados y
    tipos como códigos, sin textos traducidos (ADR-0065). Los identificadores de viajes e invitaciones empiezan con la
    región del dueño (por ejemplo sa-east:7f3c...), para que la puerta de entrada pueda reenviar a esa región
    (ADR-0062).
servers:
  - url: https://{region}.api.trotamundos.example/v1
    variables:
      region:
        default: sa-east
        description: Región de origen del usuario; la entrada global elige el servidor (ADR-0003).
security:
  - bearerAuth: []
paths:
  /panel:
    get:
      summary: Panel de viajes activos del usuario autenticado
      description: >
        Lectura por clave del documento panel_por_usuario (ADR-0040). El ETag es la versión del panel; con
        If-None-Match vigente responde 304 sin cuerpo (ADR-0041). Prioridad alta ante sobrecarga (ADR-0047).
      operationId: getPanel
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Panel actual
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
        "304":
          description: El panel no cambió desde la versión indicada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /panel/events/ticket:
    post:
      summary: Ticket para abrir la conexión SSE
      description: >
        El navegador no puede enviar el encabezado Authorization en una conexión SSE. Con el token de acceso, el
        cliente pide un ticket y lo pasa en GET /panel/events (ADR-0060). El ticket está firmado por la puerta de
        entrada, empieza con el prefijo de la región (para que la entrada global lo enrute sin token), lleva el
        userId y vence a los 30 s. Se valida sin estado compartido; no se controla el uso único: reusarlo dentro de
        los 30 s solo abre otra conexión de avisos del mismo usuario, sin datos de reservas. No autoriza ninguna
        otra operación y no se registra en los logs.
      operationId: createPanelEventsTicket
      responses:
        "201":
          description: Ticket emitido
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresAt]
                properties:
                  ticket:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /panel/events:
    get:
      summary: Avisos de cambio del panel (Server-Sent Events)
      description: >
        Conexión SSE servida por el notificador (ADR-0046). Al conectarse (y en cada reconexión) el servidor envía
        el evento `ready`; recién entonces el cliente revalida con GET /panel e If-None-Match, para no perder cambios
        ocurridos antes de la suscripción o durante una desconexión. Luego cada evento `panel-changed` informa solo
        la nueva versión del panel; si es mayor que la del cliente, este pide GET /panel. El servidor no guarda
        avisos de conexiones caídas: reconectar no los recupera, la revalidación sí. Mientras la conexión está caída,
        el cliente revalida cada 60 s. No transporta datos de reservas. Se autentica con un ticket de un solo uso
        (POST /panel/events/ticket); cada reconexión pide un ticket nuevo.
      operationId: streamPanelChanges
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: Ticket emitido por POST /panel/events/ticket (ADR-0060)
          schema:
            type: string
      responses:
        "200":
          description: >
            Flujo de eventos `ready` (sin cuerpo) y `panel-changed` con cuerpo
            {"panelVersion":<entero>,"correlationIds":[...]}; correlationIds es opcional y sirve para informar
            POST /telemetry/panel-shown (ADR-0067)
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Ticket inválido o vencido
  /trips/archived:
    get:
      summary: Viajes anteriores (archivados) del usuario
      description: Viajes archivados en el último año (ADR-0045). Prioridad baja ante sobrecarga (ADR-0047).
      operationId: listArchivedTrips
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Página de viajes archivados
          content:
            application/json:
              schema:
                type: object
                required: [trips]
                properties:
                  trips:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trip"
                  nextCursor:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
  /trips/{tripId}:
    get:
      summary: Detalle de un viaje
      description: >
        Para los viajes que el panel muestra solo en resumen cuando el usuario tiene más de 15 viajes activos, y para
        los viajes archivados (ADR-0040). Prioridad alta, igual que el panel.
      operationId: getTrip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Viaje con todas sus reservas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /trips/{tripId}/archive:
    post:
      summary: Archivar un viaje a mano
      description: Saca el viaje del panel antes de que lo haga la tarea diaria (ADR-0045). Prioridad baja.
      operationId: archiveTrip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Viaje archivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El viaje ya está archivado
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
  /trips/{tripId}/reactivate:
    post:
      summary: Devolver un viaje archivado al panel
      description: >
        Para los casos en que el viaje sigue en curso sin que ningún proveedor lo haya informado (ADR-0045).
        El viaje no se vuelve a archivar antes de la fecha de reactivación + 7 días. Prioridad baja.
      operationId: reactivateTrip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Viaje activo nuevamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El viaje no está archivado
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
  /trips/{tripId}/shares:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      summary: Personas con las que el dueño compartió el viaje
      description: Invitaciones pendientes y aceptadas del viaje (ADR-0061). Solo el dueño. Prioridad baja.
      operationId: listTripShares
      responses:
        "200":
          description: Invitaciones del viaje
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items:
                      $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
    post:
      summary: Invitar a una persona a ver el viaje (RF-08)
      description: >
        Crea una invitación pendiente y envía al email un enlace con un secreto de un solo uso que vence en 7 días.
        La invitación se registra en la auditoría (ADR-0061). Solo el dueño. Prioridad media.
      operationId: createTripShare
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Invitación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
  /trips/{tripId}/shares/{shareId}:
    parameters:
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/ShareId"
    delete:
      summary: Revocar un permiso o cancelar una invitación
      description: >
        Tiene efecto en la siguiente lectura de la persona, porque el permiso se verifica siempre (ADR-0061). Borra
        el email del invitado. Se registra en la auditoría. Solo el dueño. Prioridad alta, igual que el panel: quitar
        un acceso no debe esperar a que pase una sobrecarga.
      operationId: revokeTripShare
      responses:
        "204":
          description: Permiso quitado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: No se pudo registrar la operación en la auditoría; el permiso no se quitó y el cliente reintenta
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
  /shares/{shareId}/accept:
    parameters:
      - $ref: "#/components/parameters/ShareId"
    post:
      summary: Aceptar una invitación con la cuenta propia
      description: >
        La persona invitada, con sesión iniciada, envía el secreto recibido por email. Se acepta solo si el
        emailHmac de su token (email verificado) coincide con el de la invitación, así que otra cuenta no puede
        aceptarla aunque tenga el enlace (ADR-0061). Desde ese momento el permiso queda atado a su userId. Aceptar
        otra vez con la misma cuenta no tiene efecto. Si el viaje es de otra región, la puerta de entrada reenvía la
        solicitud (ADR-0062). Después de aceptar, la app registra la referencia en su región con POST /shared/trips.
        Cada intento, aceptado o no, se registra en la auditoría. Prioridad media.
      operationId: acceptShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret]
              properties:
                secret:
                  type: string
      responses:
        "200":
          description: Invitación aceptada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedTripRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            La invitación no existe, venció, fue cancelada, el secreto no coincide o el email de la cuenta no es el
            invitado
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
  /shared/trips:
    get:
      summary: Viajes que otras personas compartieron conmigo
      description: >
        Devuelve solo las referencias guardadas en la partición del usuario (ADR-0062); cada viaje se lee con
        GET /shared/trips/{tripId}. Prioridad baja.
      operationId: listSharedTrips
      responses:
        "200":
          description: Referencias a viajes compartidos
          content:
            application/json:
              schema:
                type: object
                required: [trips]
                properties:
                  trips:
                    type: array
                    items:
                      $ref: "#/components/schemas/SharedTripRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
    post:
      summary: Registrar en mi región la referencia a un viaje que acepté
      description: >
        Lo llama la app después de aceptar una invitación. El módulo usuarios guarda en la partición del usuario solo
        el identificador del viaje y la fecha (ADR-0062). Es idempotente y reintentable. La referencia no da permiso:
        el permiso se verifica en la región del dueño en cada lectura. Prioridad media.
      operationId: addSharedTripRef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedTripRef"
      responses:
        "200":
          description: Referencia registrada (o ya existía)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedTripRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
  /shared/trips/{tripId}:
    parameters:
      - $ref: "#/components/parameters/TripId"
    delete:
      summary: Quitar de mi lista la referencia a un viaje compartido
      description: >
        La app la borra cuando la lectura del viaje devuelve 404 (permiso quitado o viaje eliminado) o cuando el
        usuario lo pide. Solo afecta a la lista del usuario, en su región; no cambia el permiso. Idempotente.
      operationId: removeSharedTripRef
      responses:
        "204":
          description: Referencia borrada (o no existía)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      summary: Ver un viaje compartido (RF-08, QA-7)
      description: >
        El módulo comparticion de la región del dueño verifica que el usuario del token tenga un permiso vigente y
        registra el acceso, permitido o rechazado, antes de responder (ADR-0061). Si el viaje es de otra región, la
        puerta de entrada reenvía la solicitud a esa región (ADR-0062). Sin permiso responde 404, igual que si el
        viaje no existiera. Si no se puede registrar el acceso o la región del dueño no responde, 503. Los rechazos
        que ocurren en la puerta de entrada (sin token, región inexistente, región del dueño sin respuesta) los
        registra la puerta en la auditoría de su región. Prioridad alta.
      operationId: getSharedTrip
      responses:
        "200":
          description: Viaje en solo lectura, sin notas ni códigos de reserva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedTrip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: No se pudo registrar el acceso o la región del dueño no responde; el acceso se rechaza
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
  /trips/{tripId}/social-card:
    parameters:
      - $ref: "#/components/parameters/TripId"
    post:
      summary: Crear la tarjeta de resumen para redes sociales
      description: >
        Genera una tarjeta pública con destino, mes y cantidad de días, sin datos de reservas, y devuelve su enlace
        (ADR-0063). El enlace no da acceso al viaje. Si ya existe, devuelve la misma. Solo el dueño. Prioridad baja.
      operationId: createSocialCard
      responses:
        "201":
          description: Tarjeta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
    delete:
      summary: Borrar la tarjeta; su enlace deja de funcionar
      operationId: deleteSocialCard
      responses:
        "204":
          description: Tarjeta borrada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /cards/{cardId}:
    get:
      summary: Página pública de la tarjeta (vista previa en redes)
      description: >
        Página HTML con metadatos Open Graph (título, descripción e imagen) que las redes usan para la vista previa
        (ADR-0063). No requiere autenticación y no contiene ni enlaza datos del itinerario. Es la única página HTML
        que sirve el núcleo, con una plantilla fija y el texto armado al crear la tarjeta en el idioma del dueño
        (excepción acotada a ADR-0004 y ADR-0065). cardId lleva el prefijo de región para que la entrada global la
        enrute sin token.
      operationId: getPublicSocialCard
      security: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z]+-[a-z]+:[A-Za-z0-9-]+$"
      responses:
        "200":
          description: Página de la tarjeta
          content:
            text/html:
              schema:
                type: string
        "404":
          description: La tarjeta no existe o fue borrada
  /telemetry/panel-shown:
    post:
      summary: La app informa cuándo mostró una versión del panel (CRN-2, QA-1)
      description: >
        Cierra la medición de punta a punta de QA-1 (ADR-0067): la app informa la versión del panel que mostró, los
        correlationIds que recibió en el evento panel-changed y el instante. Solo datos técnicos, sin datos de
        reservas. Prioridad baja: ante sobrecarga se descarta (ADR-0047).
      operationId: reportPanelShown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [panelVersion, shownAt]
              properties:
                panelVersion:
                  type: integer
                  minimum: 0
                correlationIds:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                shownAt:
                  type: string
                  format: date-time
      responses:
        "202":
          description: Recibido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
  /bookings:
    post:
      summary: Agregar una reserva manualmente (RF-04)
      description: >
        Si no se indica tripId, el núcleo la asigna por fechas o crea un viaje nuevo (ADR-0048). Prioridad media.
      operationId: createBooking
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Reserva creada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
  /bookings/{bookingId}:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Editar una reserva (RF-04)
      description: >
        Los campos editados por el usuario quedan marcados. Las novedades externas posteriores pueden cambiar los
        campos del proveedor (y se avisa al usuario); los campos del usuario se conservan (ADR-0044).
        If-Match con la versión de la reserva evita pisar un cambio concurrente. Prioridad media.
      operationId: updateBooking
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingPatch"
      responses:
        "200":
          description: Reserva actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: La reserva cambió desde la versión indicada
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
    delete:
      summary: Eliminar una reserva (RF-04)
      description: >
        Si la reserva vino de un proveedor, se guarda una marca de borrado para que las novedades posteriores no la
        recreen (ADR-0044). Prioridad media.
      operationId: deleteBooking
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Reserva eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: La reserva cambió desde la versión indicada
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Overloaded"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token de acceso de 15 minutos emitido por el proveedor de identidad (OpenID Connect) de la región de origen
        del usuario, con userId y homeRegion. La puerta de entrada valida firma y vencimiento sin consultar al
        proveedor. Si homeRegion no es su región, rechaza (401), salvo que la solicitud llegue por el canal mTLS
        desde la puerta de entrada de otra región y se refiera a un viaje o invitación con el prefijo de su región
        (ADR-0062): en ese caso valida la firma con las claves del proveedor de la región del token. Además de userId
        y homeRegion, el token lleva emailHmac (HMAC del email verificado), que se usa al aceptar invitaciones
        (ADR-0061). El cliente lo renueva con su token de renovación directamente ante el proveedor de identidad
        (ADR-0060).
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Identificador del viaje, con la región del dueño como prefijo
      schema:
        type: string
        pattern: "^[a-z]+-[a-z]+:[A-Za-z0-9-]+$"
    ShareId:
      name: shareId
      in: path
      required: true
      description: Identificador de la invitación, con la región del dueño como prefijo
      schema:
        type: string
        pattern: "^[a-z]+-[a-z]+:[A-Za-z0-9-]+$"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Versión del panel que el cliente tiene en caché
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión de la reserva que el cliente modifica
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Evita crear dos veces la misma reserva si el cliente reintenta
      schema:
        type: string
  headers:
    ETag:
      description: Versión del recurso
      schema:
        type: string
    RetryAfter:
      description: Segundos sugeridos antes de reintentar
      schema:
        type: integer
  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No autenticado
    NotFound:
      description: >
        No existe o no pertenece al usuario. Un pedido sobre un viaje ajeno pasa por el módulo comparticion y se
        registra en la auditoría (ADR-0061)
    TooManyRequests:
      description: El cliente superó su límite de solicitudes (ADR-0047)
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    Overloaded:
      description: Sobrecarga temporal; operación de prioridad media o baja rechazada (ADR-0047)
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  schemas:
    Panel:
      type: object
      required: [panelVersion, trips, unassignedBookings, notices]
      properties:
        panelVersion:
          type: integer
          minimum: 0
        trips:
          type: array
          description: Viajes activos ordenados por fecha de inicio
          items:
            $ref: "#/components/schemas/Trip"
        unassignedBookings:
          type: array
          description: Reservas sin fechas, pendientes de que el usuario las asigne a un viaje (ADR-0048)
          items:
            $ref: "#/components/schemas/Booking"
        notices:
          type: array
          description: Avisos de los últimos 7 días, por ejemplo una novedad que cambió un campo editado (ADR-0044)
          items:
            $ref: "#/components/schemas/Notice"
    Notice:
      type: object
      required: [id, type, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [provider_overrode_user_edit, booking_cancelled, schedule_changed]
        bookingId:
          type: string
        field:
          type: string
          description: Campo afectado, si corresponde
        createdAt:
          type: string
          format: date-time
    Trip:
      type: object
      required: [id, name, status]
      description: >
        En el panel, los 15 viajes activos más próximos vienen completos (con bookings); el resto viene en resumen
        (summaryOnly true, bookingCount, sin bookings) y su detalle se pide con GET /trips/{tripId} (ADR-0040).
      properties:
        summaryOnly:
          type: boolean
          default: false
        bookingCount:
          type: integer
          minimum: 0
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        reactivatedUntil:
          type: string
          format: date
          description: Si el usuario lo reactivó, no se archiva antes de esta fecha (ADR-0045)
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
    Booking:
      type: object
      required: [id, type, status, origin, version]
      properties:
        id:
          type: string
        tripId:
          type: string
        type:
          $ref: "#/components/schemas/BookingType"
        status:
          type: string
          enum: [confirmed, modified, cancelled, pending]
        origin:
          type: string
          enum: [email, provider, manual]
        provider:
          type: string
        providerReference:
          type: string
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 con el desfase horario del lugar
        endsAt:
          type: string
          format: date-time
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        arrivalTimeZone:
          $ref: "#/components/schemas/TimeZone"
        location:
          type: string
          description: Lugar de la reserva (hotel, auto) o de partida (traslados; código de aeropuerto o estación)
        arrivalLocation:
          type: string
          description: Lugar de llegada en los traslados
        displayName:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        details:
          $ref: "#/components/schemas/BookingDetails"
        notes:
          type: string
        userEditedFields:
          type: array
          description: Campos que el usuario editó; las novedades no cambian los campos del usuario (ADR-0044)
          items:
            type: string
        version:
          type: integer
          minimum: 1
    BookingInput:
      type: object
      required: [type, startsAt]
      properties:
        tripId:
          type: string
        type:
          $ref: "#/components/schemas/BookingType"
        provider:
          type: string
        providerReference:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        location:
          type: string
        arrivalLocation:
          type: string
        displayName:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        details:
          $ref: "#/components/schemas/BookingDetails"
        notes:
          type: string
    BookingPatch:
      type: object
      minProperties: 1
      properties:
        tripId:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        arrivalTimeZone:
          $ref: "#/components/schemas/TimeZone"
        location:
          type: string
        arrivalLocation:
          type: string
        displayName:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        details:
          $ref: "#/components/schemas/BookingDetails"
        notes:
          type: string
    BookingType:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: >
        Código abierto de tipo de reserva (ADR-0066). Conocidos: flight, hotel, car, train, bus. Un cliente que recibe
        un código que no conoce muestra la reserva con la vista genérica a partir de los campos comunes.
      example: train
    BookingDetails:
      type: object
      required: [schema]
      description: >
        Datos propios del tipo de reserva. schema identifica el esquema (por ejemplo train.v1), que está en
        specs/schemas/details-<tipo>.v<n>.json; el resto de las propiedades sigue ese esquema. El núcleo valida el
        bloque y lo guarda sin interpretarlo; un schema desconocido o un bloque que no lo cumple se rechaza con 400.
        Ningún esquema puede incluir códigos de reserva ni datos personales (ADR-0066).
      properties:
        schema:
          type: string
          pattern: "^[a-z][a-z0-9_]*\\.v[0-9]+$"
      additionalProperties: true
      example:
        schema: train.v1
        trainNumber: "AVE 3172"
        coach: "5"
        seat: "12A"
    TimeZone:
      type: string
      description: Zona horaria IANA del lugar (por ejemplo Asia/Tokyo); el cliente la muestra junto a la hora (ADR-0065)
      example: America/Argentina/Buenos_Aires
    Money:
      type: object
      required: [amount, currency]
      description: Monto numérico y moneda ISO 4217; el cliente lo formatea según el idioma del usuario (ADR-0065)
      properties:
        amount:
          type: number
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Share:
      type: object
      required: [id, tripId, status, createdAt]
      properties:
        id:
          type: string
        tripId:
          type: string
        email:
          type: string
          format: email
          description: Email al que se envió la invitación (solo lo ve el dueño)
        status:
          type: string
          enum: [pending, accepted, expired]
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
    SharedTripRef:
      type: object
      required: [tripId, acceptedAt]
      description: Referencia guardada en la partición de quien aceptó; no contiene datos del itinerario (ADR-0062)
      properties:
        tripId:
          type: string
        acceptedAt:
          type: string
          format: date-time
    SharedTrip:
      type: object
      required: [id, name, status, bookings]
      description: Vista de solo lectura para una persona designada; sin notas ni códigos de reserva (ADR-0061)
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/SharedBooking"
    SharedBooking:
      type: object
      required: [id, type, status]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/BookingType"
        status:
          type: string
          enum: [confirmed, modified, cancelled, pending]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        arrivalTimeZone:
          $ref: "#/components/schemas/TimeZone"
        location:
          type: string
        arrivalLocation:
          type: string
        displayName:
          type: string
        details:
          $ref: "#/components/schemas/BookingDetails"
    SocialCard:
      type: object
      required: [id, url, destination, month, days]
      description: Tarjeta pública sin datos de reservas (ADR-0063)
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        destination:
          type: string
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        days:
          type: integer
          minimum: 1
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
