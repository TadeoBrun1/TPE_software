asyncapi: 2.6.0
info:
  title: Cambios confirmados de reservas
  version: 0.1.0
  description: >
    RETIRADO en la iteración 5 (ADR-0081). Contrato de diseño de la iteración 2 coordinado con 3/4 (AMQP 0-9-1 sobre
    RabbitMQ, exchange travel.domain; ADR-0027/0028). Nunca tuvo consumidor y, con mandatory, publicarlo sin cola
    dejaba la outbox del núcleo trabada; su papel lo cubre booking.facts.v1, que consumen la analítica y la
    recomendación. El núcleo no lo publica. Se conserva como registro del diseño.
defaultContentType: application/json
channels:
  booking.changed.v1:
    publish:
      operationId: publishConfirmedBookingChange
      message:
        $ref: '#/components/messages/BookingChanged'
components:
  messages:
    BookingChanged:
      name: BookingChanged
      headers:
        type: object
        properties:
          traceparent:
            type: string
            description: Contexto de traza W3C (ADR-0067); lo propagan productores y consumidores.
          tracestate:
            type: string
      payload:
        type: object
        additionalProperties: false
        required:
        - eventId
        - schemaVersion
        - correlationId
        - homeRegion
        - userId
        - bookingId
        - bookingVersion
        - changeType
        - committedAt
        properties:
          eventId:
            type: string
            minLength: 1
          correlationId:
            type: string
            minLength: 1
          homeRegion:
            type: string
            minLength: 1
          userId:
            type: string
            minLength: 1
          bookingId:
            type: string
            minLength: 1
          schemaVersion:
            type: string
            enum:
            - '1'
          bookingVersion:
            type: integer
            minimum: 1
          changeType:
            type: string
            enum:
            - created
            - updated
            - cancelled
            - deleted
          committedAt:
            type: string
            format: date-time
